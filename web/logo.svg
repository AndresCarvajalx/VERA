<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" role="img" aria-label="VERA">
  <defs>
    <linearGradient id="arco" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e97"/>
      <stop offset="0.5" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="letras" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e97"/>
      <stop offset="0.55" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="brillo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="difuso"/>
      <feMerge><feMergeNode in="difuso"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ícono: medidor de rango de movimiento con una pierna doblada en la rodilla -->
  <g transform="translate(8 10)" filter="url(#brillo)">
    <path d="M 26 86 A 40 40 0 1 1 94 86" fill="none" stroke="url(#arco)" stroke-width="10" stroke-linecap="round"/>
    <polyline points="50,34 60,64 86,72" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="64" r="7" fill="#7cff4f"/>
  </g>
  <text x="140" y="98" font-family="Fredoka, 'Arial Rounded MT Bold', 'Segoe UI', sans-serif" font-weight="700"
        font-size="92" letter-spacing="6" fill="url(#letras)" filter="url(#brillo)">VERA</text>
</svg>
